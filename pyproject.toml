[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]
ignore = ["E501", "B008"]

[tool.ruff.isort]
known-first-party = ["app", "core", "database", "vectorstore", "prompts", "evaluation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
